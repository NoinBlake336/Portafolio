<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="24" y1="9" x2="24" y2="4" stroke="url(#aiGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="4" r="2.5" fill="#22d3ee" filter="url(#aiGlow)" />

  <!-- Ears / Audio sensors -->
  <rect x="5" y="19" width="3" height="10" rx="1.5" fill="url(#aiGrad)" />
  <rect x="40" y="19" width="3" height="10" rx="1.5" fill="url(#aiGrad)" />

  <!-- Robot Head / Screen -->
  <rect x="8" y="9" width="32" height="28" rx="8" fill="#0f172a" stroke="url(#aiGrad)" stroke-width="2" />

  <!-- Visor Screen -->
  <rect x="12" y="14" width="24" height="14" rx="4" fill="#090d16" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />

  <!-- AI Glowing Eyes -->
  <circle cx="18" cy="21" r="3" fill="url(#eyeGrad)" filter="url(#aiGlow)" />
  <circle cx="30" cy="21" r="3" fill="url(#eyeGrad)" filter="url(#aiGlow)" />

  <!-- Digital Mouth / Waveform -->
  <path d="M19 32h10" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="21" cy="32" r="0.8" fill="#ffffff" />
  <circle cx="27" cy="32" r="0.8" fill="#ffffff" />

  <!-- AI Chip sparkle badge top-right -->
  <path d="M36 6l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#facc15" />
</svg>
